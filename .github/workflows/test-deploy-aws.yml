name: Test LEM deployment | AWS

env:
  AWS_REGION: "us-east-1"
  TF_VAR_name: "edgemanager-2.25.0-github-workflow"
  TF_VAR_oem_name: "edgemanager"
  TF_VAR_app_version: "2.25.0"
  TF_VAR_ssh_pub_key: ${{ secrets.SSH_PUB_KEY }}
  TF_VAR_admin_user_name: "ubuntu"

on:
  workflow_dispatch:
    inputs:
      RUN:
        description: "What action to perform?"
        required: true
        default: "deploy"
        type: choice
        options:
          - plan
          - deploy
          - destroy

jobs:
  lem-tf-plan-aws:
    name: tf-plan-aws
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aws/examples/edgemanager-aws
    env:
      STATE: ${{ secrets.TF_STATE_CONTENT_AWS }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      TF_VAR_vpc_id: ${{ secrets.VPC_ID }}
      TF_VAR_subnet_id: ${{ secrets.SUBNET_ID }}
      TF_VAR_key_name: ${{ secrets.KEY_NAME }}
      TF_VAR_ami_owner: ${{ secrets.AMI_OWNER }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5

      - name: set state
        run: |
          printf "%s" "$STATE" > state.tf
          cat state.tf

      - name: tf-init
        run: terraform init

      - name: tf-plan
        id: plan
        run: terraform plan

  lem-tf-deploy-aws:
    name: tf-deploy-aws
    needs: lem-tf-plan-aws
    if: ${{ github.event.inputs.RUN == 'deploy' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aws/examples/edgemanager-aws
    env:
      STATE: ${{ secrets.TF_STATE_CONTENT_AWS }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      TF_VAR_vpc_id: ${{ secrets.VPC_ID }}
      TF_VAR_subnet_id: ${{ secrets.SUBNET_ID }}
      TF_VAR_key_name: ${{ secrets.KEY_NAME }}
      TF_VAR_ami_owner: ${{ secrets.AMI_OWNER }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5

      - name: set state
        run: |
          printf "%s" "$STATE" > state.tf

      - name: tf-init
        run: terraform init

      - name: tf-apply
        id: apply
        run: terraform apply -auto-approve

  lem-tf-destroy-aws:
    name: tf-destroy-aws
    needs: lem-tf-plan-aws
    if: ${{ github.event.inputs.RUN == 'destroy' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aws/examples/edgemanager-aws
    env:
      STATE: ${{ secrets.TF_STATE_CONTENT_AWS }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      TF_VAR_vpc_id: ${{ secrets.VPC_ID }}
      TF_VAR_subnet_id: ${{ secrets.SUBNET_ID }}
      TF_VAR_key_name: ${{ secrets.KEY_NAME }}
      TF_VAR_ami_owner: ${{ secrets.AMI_OWNER }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5

      - name: set state
        run: |
          printf "%s" "$STATE" > state.tf

      - name: tf-init
        run: terraform init

      - name: tf-destroy
        id: destroy
        run: terraform destroy -auto-approve
